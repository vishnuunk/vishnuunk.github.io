params:
  # theme
  defaultTheme: auto
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enchanced SEO
  env: production

  # Home Page
  profileMode:
    enabled: true
    title: "Vishnu Unnikrishnan"
    subtitle: |
      I'm a Statistician with strong background in applied problems in ML and Data Science. I hold a Master’s in Statistics (2026) from the [**Department of Statistics, CUSAT**](https://stats.cusat.ac.in/), and a Bachelor’s in Mathematics from [**St. Thomas College (Autonomous), Thrissur**](https://stthomas.ac.in/). Beyond the technical work, I pride myself on being an effective communicator, a strong presenter, and an approachable collaborator who values building great relationships with my team.

      Feel free to drop an email or — even better — message me on [**LinkedIn**](https://www.linkedin.com/in/vishnu-unk/)!
 
    imageUrl: "home/profile.jpg?v=1"
    imageWidth: 220
    imageHeight: 220
    # buttons:
    #   - name: Resume
    #     url: ""

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "email"
      url: "mailto:vishnuunk@gmail.com"
    - name: "twitter"
      url: "https://x.com/getalifevishnu?s=21"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/vishnu-unk/"
    - name: "github"
      url: "https://github.com/vishnuunk"
    

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true
