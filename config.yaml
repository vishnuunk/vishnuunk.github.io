baseURL: "https://vishnuunk.github.io/"
languageCode: en-us
title: Vishnu Unnikrishnan
theme: PaperMod

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: about
      name: About Me
      url: /about/
      weight: 15
    - identifier: experience
      name: Experience
      url: /experience/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 25
    - identifier: resume
      name: Resume
      url: /files/resume_vishnu_cv.pdf
      weight: 30
    # - identifier: tags
    #   name: Tags
    #   url: /tags
    #   weight: 60
    # - identifier: notes
    #   name: Notes
    #   url: https://notes.arkalim.org
